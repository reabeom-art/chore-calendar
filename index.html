<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리집 집안일 캘린더</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    /* 스크롤바 숨김 (기능은 유지) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 부드러운 애니메이션 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen bg-[#FFF9F5] text-slate-700 font-sans selection:bg-rose-100 pb-12 antialiased">

  <!-- ========================================== -->
  <!-- 1. 메인 캘린더 화면                           -->
  <!-- ========================================== -->
  <div id="calendarView" class="animate-fade-in pb-28">
    
    <!-- 상단 헤더 -->
    <header class="bg-white/85 backdrop-blur-md shadow-sm p-4 sticky top-0 z-20 border-b border-orange-100">
      <div class="max-w-xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-rose-50 flex items-center justify-center text-rose-500 shadow-sm border border-rose-100">
            <i data-lucide="home" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-lg font-extrabold text-slate-800 tracking-tight leading-none flex items-center gap-1.5">
              <span>🏠 우리집 집안일 캘린더</span>
            </h1>
            <p class="text-[11px] text-slate-400 font-medium mt-0.5">연지와 래범이의 화목한 집안일 분담</p>
          </div>
        </div>
        <button id="quickTodayBtn" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-orange-50 text-orange-600 hover:bg-orange-100 transition-colors border border-orange-200/60 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>오늘
        </button>
      </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-5">
      
      <!-- 통계 섹션 -->
      <section class="bg-white p-5 rounded-3xl shadow-sm border border-rose-50/80">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold flex items-center gap-1.5 text-slate-700">
            <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i>
            <span>이번 달 집안일 요정</span>
          </h2>
          <div id="totalCountBadge" class="text-xs font-bold bg-amber-50 text-amber-600 px-3 py-1 rounded-full border border-amber-200/50">총 0회</div>
        </div>
        
        <div class="flex justify-between items-end mb-2.5 px-1 text-sm">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block"></span>
            <span id="yeonjiCountText" class="font-bold text-rose-500">연지 0회</span>
          </div>
          <div id="statusCheerText" class="text-[11px] text-slate-400 font-medium">함께 만드는 깨끗한 우리집 ✨</div>
          <div class="flex items-center gap-1.5">
            <span id="raebeomCountText" class="font-bold text-blue-500">래범 0회</span>
            <span class="w-2.5 h-2.5 rounded-full bg-blue-400 inline-block"></span>
          </div>
        </div>
        
        <!-- 프로그레스 바 -->
        <div class="h-4 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner p-0.5">
          <div id="yeonjiBar" class="h-full bg-gradient-to-r from-rose-300 to-rose-400 rounded-l-full transition-all duration-700 ease-out" style="width: 50%"></div>
          <div id="raebeomBar" class="h-full bg-gradient-to-r from-blue-400 to-blue-300 rounded-r-full transition-all duration-700 ease-out" style="width: 50%"></div>
        </div>
      </section>

      <!-- 포스트잇 (부탁하기) 섹션 -->
      <section class="bg-white p-5 rounded-3xl shadow-sm border border-rose-50/80">
        <div class="flex items-center justify-between mb-3.5">
          <h2 class="text-base font-bold flex items-center gap-1.5 text-slate-700">
            <i data-lucide="message-square" class="w-5 h-5 text-emerald-400"></i>
            <span>📝 이거 해주세요~!</span>
          </h2>
          <span id="memoCountBadge" class="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full font-semibold border border-emerald-100">0개의 부탁</span>
        </div>
        
        <!-- 입력부 -->
        <div class="flex flex-col gap-3 mb-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-500 ml-1">요청자:</span>
            <div class="flex bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm p-0.5">
              <button id="memoRequesterYeonjiBtn" type="button" class="px-3.5 py-1 text-xs font-bold transition-all rounded-md bg-rose-400 text-white shadow-sm">연지</button>
              <button id="memoRequesterRaebeomBtn" type="button" class="px-3.5 py-1 text-xs font-bold transition-all rounded-md text-slate-400 hover:bg-blue-50">래범</button>
            </div>
          </div>
          <div class="flex gap-2">
            <input id="memoTextInput" type="text" placeholder="예: 건조기 다 돌아가면 꺼내주세요!" class="flex-1 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-300" />
            <button id="memoSubmitBtn" type="button" class="px-4 py-2.5 bg-emerald-400 text-white rounded-xl font-bold hover:bg-emerald-500 transition-all whitespace-nowrap">등록</button>
          </div>
        </div>

        <!-- 메모 리스트 -->
        <div id="memosContainer" class="space-y-3"></div>
      </section>

      <!-- 캘린더 섹션 -->
      <section class="bg-white p-4 sm:p-5 rounded-3xl shadow-sm border border-rose-50/80">
        <div class="flex items-center justify-between mb-4 px-2">
          <button id="prevMonthBtn" type="button" class="p-2 hover:bg-slate-100 rounded-full transition-colors active:scale-95"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-500"></i></button>
          <h2 id="calendarTitle" class="text-lg font-extrabold text-slate-700 flex items-center gap-2">
            <i data-lucide="calendar" class="w-5 h-5 text-orange-400"></i>
            <span></span>
          </h2>
          <button id="nextMonthBtn" type="button" class="p-2 hover:bg-slate-100 rounded-full transition-colors active:scale-95"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i></button>
        </div>

        <div class="grid grid-cols-7 gap-1 mb-1">
          <div class="text-center text-xs font-bold py-2 text-rose-400">일</div>
          <div class="text-center text-xs font-bold py-2 text-slate-400">월</div>
          <div class="text-center text-xs font-bold py-2 text-slate-400">화</div>
          <div class="text-center text-xs font-bold py-2 text-slate-400">수</div>
          <div class="text-center text-xs font-bold py-2 text-slate-400">목</div>
          <div class="text-center text-xs font-bold py-2 text-slate-400">금</div>
          <div class="text-center text-xs font-bold py-2 text-blue-400">토</div>
        </div>

        <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
      </section>
    </main>

    <!-- 플로팅 버튼 -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-30">
      <button id="openAddViewBtn" type="button" class="w-full bg-gradient-to-r from-orange-400 to-rose-400 text-white rounded-2xl py-4 px-6 flex items-center justify-center gap-2 shadow-lg shadow-rose-200/80 font-bold text-lg border border-white/20 active:scale-95 transition-transform">
        <i data-lucide="plus" class="w-6 h-6 stroke-[3]"></i>
        <span>집안일 추가하기</span>
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. 기록 추가 화면                             -->
  <!-- ========================================== -->
  <div id="addView" class="hidden animate-slide-up min-h-screen bg-white pb-16">
    <header class="bg-white p-4 sticky top-0 z-20 border-b border-slate-100">
      <div class="max-w-xl mx-auto flex items-center relative">
        <button id="closeAddViewBtn" type="button" class="absolute left-0 p-2 text-slate-400 hover:bg-slate-50 rounded-full transition"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
        <h1 class="text-lg font-extrabold text-slate-700 w-full text-center">새로운 기록</h1>
      </div>
    </header>

    <main class="max-w-xl mx-auto p-5 space-y-7 mt-2">
      <!-- 담당자 선택 -->
      <section>
        <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5 text-slate-500"><i data-lucide="user" class="w-4 h-4 text-slate-400"></i>누가 했나요?</h2>
        <div class="flex gap-4">
          <button id="personYeonjiBtn" type="button" class="flex-1 py-4 rounded-2xl text-lg font-bold transition-all border-2 bg-rose-50 border-rose-400 text-rose-500 shadow-md scale-105">👩 연지</button>
          <button id="personRaebeomBtn" type="button" class="flex-1 py-4 rounded-2xl text-lg font-bold transition-all border-2 bg-white border-slate-100 text-slate-400">👨 래범</button>
        </div>
      </section>

      <!-- 날짜 선택 -->
      <section class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-orange-400"></i><span class="text-xs font-bold text-slate-600">기록할 날짜:</span></div>
        <input id="choreDateInput" type="date" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none" />
      </section>

      <!-- 자주 하는 항목 -->
      <section>
        <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5 text-slate-500"><i data-lucide="check-circle-2" class="w-4 h-4 text-slate-400"></i>자주 하는 집안일 목록</h2>
        <div id="presetsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        <div class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-100 flex gap-2">
          <input id="newPresetInput" type="text" placeholder="새 고정 항목 추가 (예: 식물 물주기)" class="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none" />
          <button id="newPresetBtn" type="button" class="px-3.5 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold active:scale-95 transition-transform whitespace-nowrap">추가</button>
        </div>
      </section>

      <div class="h-px w-full bg-slate-100"></div>

      <!-- 1회성 항목 -->
      <section>
        <h2 class="text-sm font-bold mb-3 text-slate-500">목록에 없는 집안일인가요?</h2>
        <div class="flex gap-2">
          <input id="oneTimeChoreInput" type="text" placeholder="직접 입력" class="flex-1 px-4 py-3.5 bg-white border-2 border-slate-100 rounded-2xl text-sm focus:outline-none focus:border-orange-300" />
          <button id="oneTimeChoreBtn" type="button" class="px-6 py-3.5 bg-slate-700 text-white rounded-2xl font-bold active:scale-95 transition-transform flex items-center justify-center gap-1 whitespace-nowrap">
            <i data-lucide="plus" class="w-4 h-4"></i>기록
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- 모달: 특정 일자 상세 정보                     -->
  <!-- ========================================== -->
  <div id="dayModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-100 animate-slide-up space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="dayModalTitle" class="text-base font-extrabold text-slate-800 flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4 text-orange-400"></i><span></span>
        </h3>
        <button id="dayModalCloseBtn" type="button" class="p-1 text-slate-400 hover:bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="dayModalContent" class="max-h-60 overflow-y-auto space-y-2 py-1"></div>
      <div class="pt-2 flex gap-2">
        <button id="dayModalAddChoreBtn" type="button" class="flex-1 py-2.5 bg-gradient-to-r from-orange-400 to-rose-400 text-white font-bold rounded-xl text-xs active:scale-95 transition-transform">+ 이 날짜에 추가</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 토스트 알림                                 -->
  <!-- ========================================== -->
  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-2.5 rounded-full shadow-lg text-xs font-semibold flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i><span id="toastMsg">알림</span>
  </div>

  <!-- Javascript -->
  <script>
    // State
    let choreLogs = [];
    let choreMemos = [];
    let customPresets = [];
    
    let currentDate = new Date(); // 항상 접속 기기의 현재 날짜 사용
    let selectedPerson = '연지';
    let memoRequester = '연지';
    let selectedModalDate = null;
    const defaultPresets = ['설거지', '화장실 청소', '빨래', '분리수거', '청소기', '바닥 닦기', '요리', '쓰레기 버리기'];

    // 유틸: 포맷팅
    function formatDateStr(timestamp) {
      const d = new Date(timestamp);
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // 샘플 데이터 (초기 진입시 빈 화면 방지용)
    function getSampleData() {
      const now = new Date();
      return {
        logs: [
          { id: 'l1', person: '연지', chore: '요리', timestamp: now.getTime() - 86400000 },
          { id: 'l2', person: '래범', chore: '설거지', timestamp: now.getTime() - 80000000 },
          { id: 'l3', person: '연지', chore: '빨래', timestamp: now.getTime() }
        ],
        memos: [
          { id: 'm1', requester: '래범', text: '재활용 봉투 사갈게요!', timestamp: now.getTime() }
        ],
        presets: []
      };
    }

    // 데이터 로드/저장
    function loadData() {
      try {
        const storedLogs = localStorage.getItem('prod_chore_logs');
        const storedMemos = localStorage.getItem('prod_chore_memos');
        const storedPresets = localStorage.getItem('prod_chore_presets');

        if (storedLogs && storedMemos) {
          choreLogs = JSON.parse(storedLogs);
          choreMemos = JSON.parse(storedMemos);
          customPresets = storedPresets ? JSON.parse(storedPresets) : [];
        } else {
          const s = getSampleData();
          choreLogs = s.logs; choreMemos = s.memos; customPresets = s.presets;
          saveData();
        }
      } catch (e) { console.error('Storage Err:', e); }
    }

    function saveData() {
      localStorage.setItem('prod_chore_logs', JSON.stringify(choreLogs));
      localStorage.setItem('prod_chore_memos', JSON.stringify(choreMemos));
      localStorage.setItem('prod_chore_presets', JSON.stringify(customPresets));
    }

    // 토스트 알림
    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      el.classList.remove('opacity-0', 'pointer-events-none');
      el.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('opacity-100'); el.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // 화면 전환
    function setView(view) {
      document.getElementById('calendarView').classList.toggle('hidden', view !== 'calendar');
      document.getElementById('addView').classList.toggle('hidden', view !== 'add');
      
      if(view === 'calendar') {
        renderCalendar(); renderStats(); renderMemos();
      } else {
        const now = new Date();
        document.getElementById('choreDateInput').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        renderPresets();
        window.scrollTo(0,0);
      }
      lucide.createIcons();
    }

    // 통계 렌더링
    function renderStats() {
      const y = currentDate.getFullYear(), m = currentDate.getMonth();
      const monthLogs = choreLogs.filter(l => {
        const d = new Date(l.timestamp); return d.getFullYear() === y && d.getMonth() === m;
      });
      const yCnt = monthLogs.filter(l => l.person === '연지').length;
      const rCnt = monthLogs.filter(l => l.person === '래범').length;
      const total = yCnt + rCnt;

      document.getElementById('totalCountBadge').textContent = `총 ${total}회`;
      document.getElementById('yeonjiCountText').textContent = `연지 ${yCnt}회`;
      document.getElementById('raebeomCountText').textContent = `래범 ${rCnt}회`;

      document.getElementById('yeonjiBar').style.width = total ? `${(yCnt/total)*100}%` : '50%';
      document.getElementById('raebeomBar').style.width = total ? `${(rCnt/total)*100}%` : '50%';

      const cheer = document.getElementById('statusCheerText');
      if(total===0) cheer.textContent = '이번 달 첫 기록을 남겨보세요!';
      else if(yCnt>rCnt) cheer.textContent = '연지가 열심히 달리는 중! 🏃‍♀️';
      else if(rCnt>yCnt) cheer.textContent = '래범이가 열심히 달리는 중! 🏃‍♂️';
      else cheer.textContent = '완벽한 황금 밸런스! ⚖️';
    }

    // 메모 렌더링
    function renderMemos() {
      const container = document.getElementById('memosContainer');
      document.getElementById('memoCountBadge').textContent = `${choreMemos.length}개의 부탁`;
      container.innerHTML = '';
      if(choreMemos.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-sm text-slate-400 border-2 border-dashed border-slate-100 rounded-2xl bg-slate-50">아직 남겨진 부탁이 없어요 ✨</div>`;
        return;
      }
      const grid = document.createElement('div'); grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';
      
      [...choreMemos].sort((a,b)=>b.timestamp-a.timestamp).forEach(m => {
        const isY = m.requester === '연지';
        const card = document.createElement('div');
        card.className = `relative p-4 rounded-2xl border ${isY?'bg-rose-50 border-rose-200 text-rose-900':'bg-blue-50 border-blue-200 text-blue-900'}`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs font-bold px-2 py-0.5 rounded-md ${isY?'bg-rose-200 text-rose-800':'bg-blue-200 text-blue-800'}">${m.requester}</span>
            <span class="text-[10px] opacity-60">${formatDateStr(m.timestamp)}</span>
          </div>
          <p class="text-sm font-medium pr-8 break-words">${m.text}</p>
          <button data-id="${m.id}" class="memo-del absolute bottom-3 right-3 p-1.5 rounded-full ${isY?'bg-rose-400':'bg-blue-400'} text-white shadow"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
        `;
        grid.appendChild(card);
      });
      container.appendChild(grid);
      container.querySelectorAll('.memo-del').forEach(btn => {
        btn.addEventListener('click', () => {
          choreMemos = choreMemos.filter(x => x.id !== btn.dataset.id);
          saveData(); renderMemos(); showToast('부탁 완료! 🎉');
        });
      });
      lucide.createIcons();
    }

    // 캘린더 렌더링
    function renderCalendar() {
      const y = currentDate.getFullYear(), m = currentDate.getMonth();
      document.getElementById('calendarTitle').querySelector('span').textContent = `${y}년 ${m+1}월`;
      const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
      
      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m+1, 0).getDate();
      const monthLogs = choreLogs.filter(l => new Date(l.timestamp).getFullYear()===y && new Date(l.timestamp).getMonth()===m);
      
      for(let i=0; i<firstDay; i++) {
        const empty = document.createElement('div'); empty.className = 'p-1 min-h-[85px]'; grid.appendChild(empty);
      }
      
      const today = new Date();
      for(let d=1; d<=lastDate; d++) {
        const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
        const dayLogs = monthLogs.filter(l => new Date(l.timestamp).getDate()===d);
        const cell = document.createElement('div');
        cell.className = `border rounded-xl min-h-[85px] p-1 flex flex-col bg-white shadow-sm cursor-pointer ${isToday?'border-orange-400 bg-orange-50':'border-slate-100'}`;
        
        let color = 'text-slate-600';
        if((firstDay+d-1)%7===0) color='text-rose-400';
        else if((firstDay+d-1)%7===6) color='text-blue-400';

        const header = document.createElement('div'); header.className = 'flex justify-between px-1 mb-1';
        header.innerHTML = `<span class="text-[11px] font-bold ${color}">${d}</span>${isToday?'<span class="text-[9px] px-1 bg-orange-500 text-white rounded">오늘</span>':''}`;
        cell.appendChild(header);

        const list = document.createElement('div'); list.className = 'flex-1 flex flex-col gap-1 overflow-y-auto no-scrollbar';
        dayLogs.slice(0,3).forEach(log => {
          const isY = log.person === '연지';
          const b = document.createElement('div');
          b.className = `text-[10px] px-1.5 py-0.5 rounded truncate font-bold ${isY?'bg-rose-100 text-rose-600':'bg-blue-100 text-blue-600'}`;
          b.textContent = log.chore; list.appendChild(b);
        });
        if(dayLogs.length>3) {
          const more = document.createElement('div'); more.className = 'text-[9px] text-slate-400 text-center font-bold';
          more.textContent = `+${dayLogs.length-3}`; list.appendChild(more);
        }
        cell.appendChild(list);
        cell.addEventListener('click', () => openDayModal(y, m, d, dayLogs));
        grid.appendChild(cell);
      }
    }

    // 날짜별 상세 모달
    function openDayModal(y, m, d, logs) {
      selectedModalDate = new Date(y, m, d);
      document.getElementById('dayModalTitle').querySelector('span').textContent = `${m+1}월 ${d}일 (${logs.length}건)`;
      const content = document.getElementById('dayModalContent'); content.innerHTML = '';
      
      if(logs.length===0) content.innerHTML = `<div class="text-center py-4 text-xs text-slate-400 border border-dashed rounded-xl">기록이 없습니다.</div>`;
      else {
        logs.forEach(log => {
          const isY = log.person === '연지';
          const div = document.createElement('div');
          div.className = `flex justify-between items-center p-2 rounded-lg border ${isY?'bg-rose-50 border-rose-200':'bg-blue-50 border-blue-200'}`;
          div.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold px-2 py-0.5 rounded ${isY?'bg-rose-200 text-rose-700':'bg-blue-200 text-blue-700'}">${log.person}</span>
              <span class="text-xs font-bold text-slate-700">${log.chore}</span>
            </div>
            <button data-id="${log.id}" class="log-del p-1 text-slate-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          `;
          content.appendChild(div);
        });
        content.querySelectorAll('.log-del').forEach(btn => btn.addEventListener('click', (e) => {
          e.stopPropagation(); choreLogs = choreLogs.filter(l => l.id !== btn.dataset.id);
          saveData(); showToast('삭제되었습니다.');
          openDayModal(y, m, d, choreLogs.filter(l => new Date(l.timestamp).getDate()===d && new Date(l.timestamp).getMonth()===m));
          renderCalendar(); renderStats();
        }));
      }
      document.getElementById('dayModal').classList.remove('hidden');
      lucide.createIcons();
    }

    // 기록 추가 함수들
    function renderPresets() {
      const grid = document.getElementById('presetsGrid'); grid.innerHTML = '';
      [...defaultPresets, ...customPresets.map(p=>p.chore)].forEach(chore => {
        const btn = document.createElement('button');
        btn.className = 'py-3 px-2 bg-white border border-slate-200 rounded-xl text-sm font-bold active:scale-95 shadow-sm';
        btn.textContent = chore;
        btn.onclick = () => addChore(chore);
        grid.appendChild(btn);
      });
    }

    function addChore(chore) {
      if(!chore.trim()) return;
      let ts = Date.now();
      const dt = document.getElementById('choreDateInput').value;
      if(dt) {
        const [yy, mm, dd] = dt.split('-');
        ts = new Date(yy, mm-1, dd, new Date().getHours(), new Date().getMinutes()).getTime();
      }
      choreLogs.unshift({ id: 'l_'+Date.now(), person: selectedPerson, chore: chore.trim(), timestamp: ts });
      saveData(); showToast(`${selectedPerson}의 '${chore}' 추가 완료!`);
      setView('calendar');
    }

    // 초기화 및 이벤트 연결
    document.addEventListener('DOMContentLoaded', () => {
      loadData(); renderCalendar(); renderStats(); renderMemos();

      document.getElementById('openAddViewBtn').onclick = () => setView('add');
      document.getElementById('closeAddViewBtn').onclick = () => setView('calendar');
      document.getElementById('quickTodayBtn').onclick = () => { currentDate = new Date(); renderCalendar(); renderStats(); showToast('오늘로 이동됨'); };
      
      document.getElementById('prevMonthBtn').onclick = () => { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1); renderCalendar(); renderStats(); };
      document.getElementById('nextMonthBtn').onclick = () => { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1); renderCalendar(); renderStats(); };

      // 포스트잇
      const myBtn = document.getElementById('memoRequesterYeonjiBtn'), mrBtn = document.getElementById('memoRequesterRaebeomBtn');
      myBtn.onclick = () => { memoRequester = '연지'; myBtn.className='px-3.5 py-1 text-xs font-bold rounded-md bg-rose-400 text-white'; mrBtn.className='px-3.5 py-1 text-xs font-bold rounded-md text-slate-400 hover:bg-blue-50'; };
      mrBtn.onclick = () => { memoRequester = '래범'; mrBtn.className='px-3.5 py-1 text-xs font-bold rounded-md bg-blue-400 text-white'; myBtn.className='px-3.5 py-1 text-xs font-bold rounded-md text-slate-400 hover:bg-rose-50'; };
      
      const addMemo = () => {
        const v = document.getElementById('memoTextInput').value; if(!v.trim()) return;
        choreMemos.unshift({ id:'m_'+Date.now(), text:v, requester:memoRequester, timestamp:Date.now() });
        saveData(); document.getElementById('memoTextInput').value = ''; renderMemos(); showToast('부탁 등록됨!');
      };
      document.getElementById('memoSubmitBtn').onclick = addMemo;
      document.getElementById('memoTextInput').onkeydown = (e) => { if(e.key==='Enter') addMemo(); };

      // 집안일 등록
      const pyBtn = document.getElementById('personYeonjiBtn'), prBtn = document.getElementById('personRaebeomBtn');
      pyBtn.onclick = () => { selectedPerson='연지'; pyBtn.className='flex-1 py-4 rounded-2xl text-lg font-bold border-2 bg-rose-50 border-rose-400 text-rose-500 shadow-md scale-105'; prBtn.className='flex-1 py-4 rounded-2xl text-lg font-bold border-2 bg-white border-slate-100 text-slate-400'; };
      prBtn.onclick = () => { selectedPerson='래범'; prBtn.className='flex-1 py-4 rounded-2xl text-lg font-bold border-2 bg-blue-50 border-blue-400 text-blue-500 shadow-md scale-105'; pyBtn.className='flex-1 py-4 rounded-2xl text-lg font-bold border-2 bg-white border-slate-100 text-slate-400'; };

      const addNewPreset = () => {
        const v = document.getElementById('newPresetInput').value; if(!v.trim()) return;
        customPresets.push({ id:'p_'+Date.now(), chore:v }); saveData();
        document.getElementById('newPresetInput').value = ''; renderPresets(); showToast('새 항목 추가됨');
      };
      document.getElementById('newPresetBtn').onclick = addNewPreset;
      document.getElementById('newPresetInput').onkeydown = (e) => { if(e.key==='Enter') addNewPreset(); };

      const addOneTime = () => {
        const v = document.getElementById('oneTimeChoreInput').value; if(!v.trim()) return;
        addChore(v); document.getElementById('oneTimeChoreInput').value = '';
      };
      document.getElementById('oneTimeChoreBtn').onclick = addOneTime;
      document.getElementById('oneTimeChoreInput').onkeydown = (e) => { if(e.key==='Enter') addOneTime(); };

      // 모달 닫기 및 해당 날짜에 추가
      document.getElementById('dayModalCloseBtn').onclick = () => document.getElementById('dayModal').classList.add('hidden');
      document.getElementById('dayModal').onclick = (e) => { if(e.target.id==='dayModal') document.getElementById('dayModal').classList.add('hidden'); };
      document.getElementById('dayModalAddChoreBtn').onclick = () => {
        document.getElementById('dayModal').classList.add('hidden'); setView('add');
        if(selectedModalDate) {
          const d = selectedModalDate;
          document.getElementById('choreDateInput').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
      };

      lucide.createIcons();
    });
  </script>
</body>
</html>
